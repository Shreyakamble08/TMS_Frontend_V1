<!doctype html>
<html lang="en">

<head>
    <!-- ==========================================
         PAGE METADATA
    =========================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transport Management System Admin Login" />
    <meta name="theme-color" content="#601D49" />

    <title>Admin Login | TMS</title>

    <!-- ==========================================
         TAILWIND CSS
         Used for layout, spacing, typography and
         responsive design.
    =========================================== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ==========================================
         TAILWIND BRAND CONFIGURATION
    =========================================== -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: "#601D49",
                            dark: "#4d173b",
                            light: "#f5edf3",
                            soft: "#faf6f9",
                        },
                    },
                },
            },
        };
    </script>

    <!-- ==========================================
         CUSTOM CSS
    =========================================== -->
    <link rel="stylesheet" href="admin-login.css" />

    <!-- ==========================================
         LOGIN JAVASCRIPT
    =========================================== -->
    <script src="admin-login.js" defer></script>
</head>

<body class="min-h-screen bg-[#f6f4f6] text-gray-800 antialiased">
    <!-- ==========================================
         MAIN PAGE WRAPPER
         Centers the login card on the screen.
    =========================================== -->
    <main class="login-page min-h-screen flex items-center justify-center px-4 py-6">
        <!-- ======================================
             MAIN LOGIN CARD
             Two-column horizontal layout.
        ======================================= -->
        <section
            class="login-card w-full max-w-[1050px] grid grid-cols-1 md:grid-cols-2 bg-white overflow-hidden rounded-2xl shadow-xl border border-[#601D49]/60">
            <!-- ==================================
                 LEFT SECTION: IMAGE
                 Image occupies the entire section
            =================================== -->
            <div
                class="illustration-section relative flex flex-col justify-between overflow-hidden min-h-[400px] md:min-h-full">
                <!-- Main Illustration Image (Absolute Background) -->
                <img src="/img/Login_page.png" alt="Transport and logistics illustration"
                    class="absolute inset-0 h-full w-full object-cover object-center" />

                <!-- Gradient overlay to ensure text is readable over the image -->
                <div class="absolute inset-0 pointer-events-none">
                </div>

                <!-- Brand / Logo -->
                <div class="relative z-10 p-7 sm:p-9 text-[#601D49]">
                    <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight drop-shadow-sm">
                        TMS
                    </h2>
                    <p class="mt-1 text-xs font-medium tracking-wide text-[#601D49] drop-shadow-sm">
                        TRANSPORT MANAGEMENT SYSTEM
                    </p>
                    <div class="mt-3 h-1 w-10 rounded-full bg-[#601D49]"></div>
                </div>

                <!-- Bottom Image Caption -->
                <div class="relative z-10 p-7 sm:p-9 flex items-center gap-3 mt-auto">
                    <span class="h-[2px] w-7 rounded-full bg-white"></span>
                    <p class="text-xs font-medium tracking-wide text-[#601D49] drop-shadow-sm">
                        Connecting routes. Managing journeys.
                    </p>
                </div>
            </div>

            <!-- ==================================
                 RIGHT SECTION: LOGIN
                 Reduced padding, expanded content width
            =================================== -->
            <div class="login-section flex items-center justify-center bg-white px-6 py-8 sm:px-10 md:px-12">
                <!-- Increased max-width slightly to fill space, maintaining height -->
                <div class="login-content w-full max-w-[420px]">
                    <!-- ==================================
                         LOGIN HEADING
                    =================================== -->
                    <div class="login-header mb-6">
                        <p class="text-sm font-medium text-gray-500">Welcome to</p>

                        <h1 class="mt-1 text-3xl font-bold tracking-tight text-[#601D49] sm:text-[32px]">
                            TMS <span class="text-gray-900">Admin Portal</span>
                        </h1>

                        <p class="mt-1.5 text-sm leading-relaxed text-gray-500">
                            Sign in to manage your transport operations.
                        </p>
                    </div>

                    <!-- ==================================
                         LOGIN FORM
                    =================================== -->
                    <form id="login-form" novalidate>
                        <!-- Phone Number -->
                        <div class="mb-4">
                            <label for="phone" class="mb-2 block text-xs font-semibold text-gray-700">
                                Phone Number
                            </label>

                            <!-- Focus ring applied to the whole wrapper -->
                            <div
                                class="input-wrapper relative flex h-[48px] items-center rounded-lg border border-gray-200 bg-gray-50 transition-all focus-within:border-[#601D49] focus-within:ring-2 focus-within:ring-[#601D49]/20 focus-within:bg-white">
                                <!-- Phone Icon -->
                                <svg class="ml-3.5 h-[18px] w-[18px] shrink-0 text-gray-400 transition-colors"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                        d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                                </svg>

                                <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel"
                                    maxlength="10" placeholder="Enter your phone number" aria-describedby="phone-error"
                                    class="h-full w-full bg-transparent px-3 text-sm text-gray-800 outline-none placeholder:text-gray-400"
                                    required />
                            </div>

                            <p id="phone-error" class="field-error hidden mt-1.5 text-xs text-red-600" role="alert"></p>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="mb-2 block text-xs font-semibold text-gray-700">
                                Password
                            </label>

                            <!-- Focus ring applied to the whole wrapper -->
                            <div
                                class="input-wrapper relative flex h-[48px] items-center rounded-lg border border-gray-200 bg-gray-50 transition-all focus-within:border-[#601D49] focus-within:ring-2 focus-within:ring-[#601D49]/20 focus-within:bg-white">
                                <!-- Lock Icon -->
                                <svg class="ml-3.5 h-[18px] w-[18px] shrink-0 text-gray-400 transition-colors"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>

                                <input type="password" id="password" name="password" autocomplete="current-password"
                                    placeholder="Enter your password" aria-describedby="password-error"
                                    class="h-full w-full bg-transparent px-3 text-sm text-gray-800 outline-none placeholder:text-gray-400"
                                    required />

                                <!-- Show / Hide Password -->
                                <button type="button" id="toggle-password"
                                    class="password-toggle mr-2 flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-gray-400 transition hover:bg-[#601D49]/10 hover:text-[#601D49] focus:outline-none"
                                    aria-label="Show password" aria-pressed="false">
                                    <!-- Eye Open -->
                                    <svg id="eye-open" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>

                                    <!-- Eye Closed -->
                                    <svg id="eye-closed" class="hidden h-[18px] w-[18px]" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M3 3l18 18" />
                                    </svg>
                                </button>
                            </div>

                            <p id="password-error" class="field-error hidden mt-1.5 text-xs text-red-600" role="alert">
                            </p>
                        </div>

                        <!-- ==================================
                             LOGIN STATUS MESSAGE
                        =================================== -->
                        <div id="form-status" class="form-status hidden mb-4 rounded-lg px-3 py-2 text-xs" role="status"
                            aria-live="polite"></div>

                        <!-- ==================================
                             LOGIN BUTTON
                        =================================== -->
                        <button type="submit" id="login-btn"
                            class="login-btn mt-1 flex h-[48px] w-full items-center justify-center gap-2 rounded-lg bg-[#601D49] px-5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-[#4d173b] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#601D49] disabled:cursor-not-allowed disabled:opacity-60">
                            <span>Login</span>

                            <svg class="h-[17px] w-[17px]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </form>

                    <!-- ==================================
                         SECURITY FOOTER
                    =================================== -->
                    <div class="security-footer mt-6 flex items-center gap-3">
                        <span class="h-px flex-1 bg-gray-200"></span>

                        <div class="flex items-center gap-1.5 whitespace-nowrap text-[11px] font-medium text-gray-400">
                            <svg class="h-4 w-4 text-[#601D49]" viewBox="0 0 20 20" fill="currentColor"
                                aria-hidden="true">
                                <path fill-rule="evenodd"
                                    d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944z"
                                    clip-rule="evenodd" />
                            </svg>

                            Secure <span class="text-[#601D49]">•</span> Reliable
                            <span class="text-[#601D49]">•</span>
                            Efficient
                        </div>

                        <span class="h-px flex-1 bg-gray-200"></span>
                    </div>

                    <!-- ==================================
                         DEVELOPMENT DEMO CREDENTIALS
                    =================================== -->
                    <div
                        class="demo-credentials mt-5 rounded-lg border border-dashed border-gray-200 bg-gray-50 px-3 py-2.5">
                        <p class="mb-0.5 text-[10px] font-semibold uppercase tracking-wider text-gray-400">
                            Development Demo Access
                        </p>

                        <p class="text-[11px] leading-relaxed text-gray-500">
                            Phone:
                            <strong class="font-semibold text-gray-700">8830750491</strong>
                            <span class="mx-1 text-gray-300">|</span>
                            Password:
                            <strong class="font-semibold text-gray-700">Admin@123</strong>
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
